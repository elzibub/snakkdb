name: Add a snack
description: Submit a new snack. A bot turns this into a pull request for review.
title: "New snack: "
labels: [new-snack]
body:
  - type: markdown
    attributes:
      value: |
        One entry per **product line**: "Pocky", not "Pocky Matcha". Flavours and
        limited editions go under *Variants*. Please search the site first.
  - type: input
    id: name
    attributes: { label: Name, description: "As printed on the packaging, in Latin script if possible" }
    validations: { required: true }
  - type: input
    id: local_name
    attributes: { label: Local name, description: "The name in its original script, if different (optional), e.g. ポッキー" }
  - type: input
    id: local_lang
    attributes: { label: Local name language, description: "Language code for the local name, e.g. ja, ko, zh-Hant, th" }
  - type: input
    id: origin
    attributes: { label: Country of origin, description: "Two-letter ISO code, e.g. JP" }
    validations: { required: true }
  - type: input
    id: available_in
    attributes: { label: Also sold in, description: "Other countries where you've seen it, comma separated (optional), e.g. US, KR" }
  - type: input
    id: manufacturer
    attributes: { label: Manufacturer, description: "Company name (optional). New companies are added automatically." }
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: "What the snack mostly is, not its coating: a chocolate-covered biscuit is biscuits-cookies"
      options:
        - chips-crisps
        - crackers
        - biscuits-cookies
        - chocolate
        - candy
        - gummies-jellies
        - nuts-seeds
        - puffs-extruded
        - namkeen
        - baked-goods
        - dried-meat-seafood
        - dried-fruit
        - ice-cream-frozen
        - drinks
        - other
    validations: { required: true }
  - type: input
    id: flavors
    attributes: { label: Flavors, description: "What it tastes like, comma separated (optional), e.g. chocolate, salt and vinegar. Not textures or shapes." }
  - type: textarea
    id: variants
    attributes: { label: Variants, description: "One per line (optional), e.g. Strawberry, Matcha, Double Coat" }
  - type: input
    id: introduced
    attributes: { label: Year introduced, description: "Optional" }
  - type: textarea
    id: description
    attributes:
      label: Description
      description: "What is it, what does it taste like, any lore? Markdown is fine. English please; translations come later."
    validations: { required: true }
  - type: input
    id: sources
    attributes: { label: Sources, description: "Links backing up the facts, comma separated (optional)" }
  - type: markdown
    attributes:
      value: |
        **Photos:** after the bot opens a PR, add one there (only photos you took or that are openly licensed, please).
